name = "keskindevweb"
main = "worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = false
invocation_logs = true

# Custom Domain Routing
routes = [
  { pattern = "keskindev.com/*", zone_name = "keskindev.com" },
  { pattern = "www.keskindev.com/*", zone_name = "keskindev.com" }
]

# Cloudflare Workers / Pages Static Assets
[assets]
directory = "./public"

# Cloudflare D1 Veritabanı Bağlantısı (Dynamic SQL Engine)
[[d1_databases]]
binding = "DB"
database_name = "keskindev"
database_id = "b4c9d5f7-c90e-4c2d-b1f0-577377bdaa56"
