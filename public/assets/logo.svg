<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="kd-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="kd-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="kd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Geometric Hex Tech Emblem -->
  <g transform="translate(10, 8)">
    <polygon points="22,2 40,12 40,32 22,42 4,32 4,12" fill="rgba(0, 242, 254, 0.08)" stroke="url(#kd-grad-primary)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Sharp Stylized 'K' and Dev glyph -->
    <path d="M14 12 L14 32 M14 22 L28 12 M20 18 L30 32" stroke="url(#kd-grad-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Energy Dot -->
    <circle cx="22" cy="22" r="2.5" fill="#00f2fe" filter="url(#kd-glow)"/>
    <circle cx="34" cy="15" r="1.5" fill="#10b981"/>
  </g>

  <!-- Typography: KESKINDEV -->
  <text x="64" y="32" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="0.5" fill="#ffffff">
    KESKIN<tspan fill="url(#kd-grad-primary)">DEV</tspan>
  </text>
  <text x="65" y="46" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.5" fill="#94a3b8">
    SOFTWARE &amp; TECH LABS
  </text>
</svg>
